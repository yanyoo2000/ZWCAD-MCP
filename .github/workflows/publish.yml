name: Publish

# 打 tag 即发布（tag 形如 v0.3.0）。
#
# 校验逻辑不在这里重复，统一由 ci.yml 负责——同一份规则写两遍，
# 迟早会口径不一致。这里只做「确认 ci.yml 通过 → 发 npm」。
on:
  push:
    tags:
      - 'v*'

jobs:
  # 复用 ci.yml 的校验流程：只有它全绿才继续发布。
  # 这样打 tag 时不会绕过任何检查。
  ci:
    name: 复用 CI 校验
    uses: ./.github/workflows/ci.yml

  publish:
    name: 发布到 npm
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # npm provenance 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 发布
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
