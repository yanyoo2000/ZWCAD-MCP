name: Publish

# 打 tag 即发布（tag 形如 v0.3.2）。
#
# 本仓库同时发布到两个渠道，包名相同（都叫 zwcad-mcp）：
# - npm：Node 启动器 + Python 源码，用户 `npx zwcad-mcp`
# - PyPI：仅 Python 源码，用户 `uvx zwcad-mcp`
#
# 两者版本号由 scripts/sync-version.py 保证一致（CI 里会检查）。
#
# 校验逻辑不在这里重复，统一由 ci.yml 负责——同一份规则写两遍，
# 迟早会口径不一致。这里只做「确认 ci.yml 通过 → 发布」。
on:
  push:
    tags:
      - 'v*'

jobs:
  # 复用 ci.yml 的校验流程：只有它全绿才继续发布。
  # 这样打 tag 时不会绕过任何检查。
  ci:
    name: 复用 CI 校验
    uses: ./.github/workflows/ci.yml

  npm:
    name: 发布到 npm
    needs: ci
    runs-on: windows-latest
    # 声明 environment 才会出现在仓库首页的 Deployments 里。
    # 纯展示用途，不要给它加保护规则（审批/等待），否则发布会卡住等人。
    environment:
      name: npm
      url: https://www.npmjs.com/package/zwcad-mcp
    permissions:
      contents: read
      id-token: write # npm provenance 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 发布
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: 发布到 PyPI
    # 依赖 npm 是为了「npm 失败时 PyPI 不再单独跑」——避免反向分裂
    # （PyPI 发出去、npm 没有）。它无法消除分裂本身：npm 一旦发出就不可撤回，
    # 此时 PyPI 再失败，仍然是「npm 已发、PyPI 未发」。
    # 真实收益是顺序确定：从 CI 结论能一眼看出卡在哪个渠道。
    needs: [ci, npm]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zwcad-mcp
    permissions:
      # 显式声明 permissions 后，未列出的 scope 会降为 none。
      # checkout 在公开仓库上靠匿名 clone 也能工作（实测 contents: none 时
      # 该步骤仍成功），但显式给 read 更稳妥，也与上面的 npm job 保持一致。
      contents: read
      id-token: write # Trusted Publishing，无需 API token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install --quiet --disable-pip-version-check build
          python -m build

      - name: 校验产物版本与 tag 一致
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          WHEEL=$(ls dist/*.whl | head -1)
          echo "tag=$TAG wheel=$WHEEL"
          case "$WHEEL" in
            *"$TAG"*) echo "版本一致" ;;
            *) echo "::error::wheel 版本与 tag ($TAG) 不一致"; exit 1 ;;
          esac

      # 用 PyPI 的 OIDC 受信发布，不需要在仓库里存 API token。
      # 需要在 PyPI 项目设置里配置：本仓库 + 本 workflow 文件名。
      - name: 发布
        uses: pypa/gh-action-pypi-publish@release/v1

  offline:
    name: 构建离线包并发布 Release
    needs: ci
    runs-on: windows-latest
    environment:
      name: release
      url: https://github.com/yanyoo2000/ZWCAD-MCP/releases
    permissions:
      contents: write # 上传 Release 附件需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 离线包自带 Python 与依赖，面向「无 Python、无网络、不允许自行安装」
      # 的产线机器。构建需要联网下载依赖，但产物本身零网络依赖。
      - name: 构建离线包
        run: node scripts/build-offline.js

      # 同时挂 whl 与 sdist：内网环境无法访问 PyPI 时可直接下载后本地安装。
      # 这一步与 pypi job 的构建重复，但换来「所有产物都在 Release 上」，
      # 比用 artifact 跨 job 传递简单，几十秒的成本可以接受。
      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install --quiet --disable-pip-version-check build
          python -m build

      # WorkBuddy 连接器包：可直接上传到开放平台的 zip。
      # 平台审核会比对 connector-meta.json 的 version 与 mcp.json 实际拉取的版本，
      # 两者不一致会被判定「声明版本与实际不符」而退回。所以这里打出的包
      # 必须与 tag 同版本，下面有校验。
      - name: 构建 WorkBuddy 连接器包
        run: node scripts/build-connector.js

      - name: 校验产物
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "tag=$TAG"

          ZIP=$(ls dist-offline/*.zip | head -1)
          echo "离线包: $ZIP"
          case "$ZIP" in
            *"$TAG"*) echo "  OK 版本一致" ;;
            *) echo "::error::离线包版本与 tag ($TAG) 不一致"; exit 1 ;;
          esac

          WHEEL=$(ls dist/*.whl | head -1)
          echo "wheel: $WHEEL"
          case "$WHEEL" in
            *"$TAG"*) echo "  OK 版本一致" ;;
            *) echo "::error::wheel 版本与 tag ($TAG) 不一致"; exit 1 ;;
          esac

          # 连接器包的版本藏在 connector-meta.json 里，必须单独查
          META=$(ls dist/workbuddy/zwcad-mcp/connector-meta.json | head -1)
          META_VER=$(node -p "require('./$META').version")
          echo "连接器: $META -> $META_VER"
          if [ "$META_VER" != "$TAG" ]; then
            echo "::error::connector-meta.json 的 version ($META_VER) 与 tag ($TAG) 不一致"
            exit 1
          fi
          echo "  OK 版本一致"

          ls -lh dist-offline/ dist/

      # 打成单一 zip，方便直接上传到开放平台的发布表单。
      # 平台要求包根目录下直接是 connector-meta.json / mcp.json / icon.png，
      # 所以从 zwcad-mcp 目录内部打包，不要多套一层。
      - name: 打包 WorkBuddy 连接器
        shell: pwsh
        run: |
          $src = 'dist\workbuddy\zwcad-mcp'
          if (-not (Test-Path $src)) { Write-Error "找不到 $src"; exit 1 }
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $out = "zwcad-mcp-connector-$tag.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $out -CompressionLevel Optimal
          Write-Output "生成 $out"
          Get-ChildItem $out | ForEach-Object { Write-Output ("  {0:N1} KB" -f ($_.Length/1KB)) }
          Write-Output "--- 包内文件 ---"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $out)).Entries | ForEach-Object { Write-Output "  $($_.FullName)" }

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-offline/*.zip
            dist/*.whl
            dist/*.tar.gz
            zwcad-mcp-connector-*.zip
          generate_release_notes: true
          body: |
            ## 安装方式

            | 渠道 | 命令 |
            |---|---|
            | npm | `npx -y zwcad-mcp` |
            | PyPI | `pip install zwcad-mcp` |
            | **uvx** | `uvx zwcad-mcp` |
            | 离线包 | 下载下方 `*-offline.zip`，解压即用 |
            | 本地 whl | 下载 `*.whl` 后 `uvx --from <文件路径> zwcad-mcp` |

            ## Release 附件说明

            | 文件 | 用途 | 使用前提 |
            |---|---|---|
            | `*-offline.zip` | 完整运行环境 | 无 Python、无外网、不允许自行安装 |
            | `*.whl` | Python 安装包 | 有 Python 或 uv，且能访问 PyPI（或内网镜像） |
            | `*.tar.gz` | 源码包 | 需要自行构建时 |
            | `zwcad-mcp-connector-*.zip` | WorkBuddy 连接器包 | 上传到 WorkBuddy 开放平台 |

            > 所有产物版本号一致（均来自同一 tag）。连接器的
            > `connector-meta.json` 版本与 npm 上实际拉取的版本相同，
            > 避免审核时出现「声明版本与实际不符」。

            ### 离线包说明

            面向**无 Python 环境、无外网、不允许自行安装**的产线机器：

            - 自带便携式 Python 与全部依赖，**不需要联网**
            - 解压后按包内 `使用说明.txt` 配置客户端
            - 推荐用 `node bridge.js` 启动（自动处理 PYTHONPATH）
            - 机器无 Node 时可用纯 Python 方式，配置见说明文件

            > 离线包与 npm、PyPI 渠道版本号一致，工具集相同。
