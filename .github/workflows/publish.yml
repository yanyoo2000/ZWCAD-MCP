name: Publish

# 打 tag 即发布（tag 形如 v0.3.2）。
#
# 本仓库同时发布到两个渠道，包名相同（都叫 zwcad-mcp）：
# - npm：Node 启动器 + Python 源码，用户 `npx zwcad-mcp`
# - PyPI：仅 Python 源码，用户 `uvx zwcad-mcp`
#
# 两者版本号由 scripts/sync-version.py 保证一致（CI 里会检查）。
#
# 校验逻辑不在这里重复，统一由 ci.yml 负责——同一份规则写两遍，
# 迟早会口径不一致。这里只做「确认 ci.yml 通过 → 发布」。
on:
  push:
    tags:
      - 'v*'

jobs:
  # 复用 ci.yml 的校验流程：只有它全绿才继续发布。
  # 这样打 tag 时不会绕过任何检查。
  ci:
    name: 复用 CI 校验
    uses: ./.github/workflows/ci.yml

  npm:
    name: 发布到 npm
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # npm provenance 需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 发布
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: 发布到 PyPI
    # 依赖 npm 是为了「npm 失败时 PyPI 不再单独跑」——避免反向分裂
    # （PyPI 发出去、npm 没有）。它无法消除分裂本身：npm 一旦发出就不可撤回，
    # 此时 PyPI 再失败，仍然是「npm 已发、PyPI 未发」。
    # 真实收益是顺序确定：从 CI 结论能一眼看出卡在哪个渠道。
    needs: [ci, npm]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zwcad-mcp
    permissions:
      # 显式声明 permissions 后，未列出的 scope 会降为 none。
      # checkout 在公开仓库上靠匿名 clone 也能工作（实测 contents: none 时
      # 该步骤仍成功），但显式给 read 更稳妥，也与上面的 npm job 保持一致。
      contents: read
      id-token: write # Trusted Publishing，无需 API token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建 wheel 与 sdist
        run: |
          python -m pip install --quiet --disable-pip-version-check build
          python -m build

      - name: 校验产物版本与 tag 一致
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          WHEEL=$(ls dist/*.whl | head -1)
          echo "tag=$TAG wheel=$WHEEL"
          case "$WHEEL" in
            *"$TAG"*) echo "版本一致" ;;
            *) echo "::error::wheel 版本与 tag ($TAG) 不一致"; exit 1 ;;
          esac

      # 用 PyPI 的 OIDC 受信发布，不需要在仓库里存 API token。
      # 需要在 PyPI 项目设置里配置：本仓库 + 本 workflow 文件名。
      - name: 发布
        uses: pypa/gh-action-pypi-publish@release/v1
