[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zwcad-mcp"
version = "0.1.0"
description = "MCP server driving ZWCAD platform and ZWCAD Mechanical via COM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.10.3,<3",
    "pyzwcad>=0.1",
    "pyzwcadmech>=0.3.0",
    "comtypes>=1.1",
    "pywin32>=305",
]

[project.scripts]
zwcad-mcp-python = "zwcad2d.server:main"

# Python 源码位于 runtime/zwcad2d（与 npm 包共用同一份，不另存副本）
[tool.hatch.build]
include = ["runtime/zwcad2d", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel]
packages = ["runtime/zwcad2d"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "README.md"
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = ["runtime/zwcad2d", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]
exclude = ["node_modules/**", "dist/**", "connector/**", "scripts/**", ".venv/**", "__pycache__/**"]
