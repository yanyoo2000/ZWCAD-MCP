[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zwcad-mcp"
version = "0.3.10"
description = "MCP server driving ZWCAD platform and ZWCAD Mechanical via COM"
# PyPI 页面用独立 README：主 README 讲 npm 启动器，对 pip 用户是噪音。
# 两份文件各管一摊，见 CONTRIBUTING 的「文档分工」。
readme = "README-pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.10.3,<3",
    "pyzwcad>=0.1",
    "pyzwcadmech>=0.3.0",
    "comtypes>=1.1",
    "pywin32>=305",
]

# PyPI 包页侧栏的链接来源。没有这一段，PyPI 上就找不到源码仓库。
# npm 侧的同类信息在 package.json 的 repository/bugs/homepage，两处需各自维护。
[project.urls]
Homepage = "https://github.com/yanyoo2000/ZWCAD-MCP"
Repository = "https://github.com/yanyoo2000/ZWCAD-MCP"
Issues = "https://github.com/yanyoo2000/ZWCAD-MCP/issues"
Changelog = "https://github.com/yanyoo2000/ZWCAD-MCP/releases"

[project.scripts]
zwcad-mcp-python = "zwcad2d.server:main"

# Python 源码位于 runtime/zwcad2d（与 npm 包共用同一份，不另存副本）
[tool.hatch.build]
include = ["runtime/zwcad2d", "README.md", "README-pypi.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel]
packages = ["runtime/zwcad2d"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "README.md"
"README-pypi.md" = "README-pypi.md"
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = ["runtime/zwcad2d", "README.md", "README-pypi.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]
exclude = ["node_modules/**", "dist/**", "connector/**", "scripts/**", ".venv/**", "__pycache__/**"]
